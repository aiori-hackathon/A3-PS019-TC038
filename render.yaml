# Render Blueprint: one free web service running the API and the web UI together.
# Free plan limits: no persistent disk (data resets on restart/redeploy/sleep) and the
# service sleeps after 15 minutes without traffic (the app shows a wake-up screen).
services:
  - type: web
    name: privacytwin
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: GROQ_API_KEY         # optional: enables Ask AI, AI analyst and auto-triage (metadata only)
        sync: false               # set in the dashboard; never committed
      - key: GROQ_MODEL           # optional override; default openai/gpt-oss-120b
        sync: false
      - key: PRIVACYTWIN_SECRET
        generateValue: true
      - key: PRIVACYTWIN_FINGERPRINT_PEPPER
        generateValue: true
